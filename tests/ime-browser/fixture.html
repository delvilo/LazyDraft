<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boshiamy IME Browser Test Fixture</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/boshiamy.css">
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: sans-serif;
    }
    #fixture-container {
      max-width: 600px;
      margin: 0 auto;
    }
    #fixture-note {
      width: 100%;
      height: 200px;
      font-size: 16px;
      line-height: 1.5;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: vertical;
    }
    .narrow-container {
      max-width: 300px;
    }
  </style>
</head>
<body>
  <div id="fixture-container">
    <h2>Boshiamy IME Test Fixture</h2>
    <textarea id="fixture-note" placeholder="Type here..."></textarea>
  </div>
</body>
</html>
